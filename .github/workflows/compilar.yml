name: Compilar PPSSPP Xbox 360

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar MSBuild Antigo
      uses: microsoft/setup-msbuild@v2

    - name: Instalar SDK do Xbox 360 (XDK Lite)
      run: |
        # Baixa as ferramentas PowerPC necessárias que corrigem a compilação
        invoke-webrequest -Uri "https://github.com" -OutFile "xdk.zip"
        expand-archive -Path "xdk.zip" -DestinationPath "C:\XDK"
        echo "XDK=C:\XDK" >> $GITHUB_ENV
        echo "C:\XDK\bin\win32" >> $GITHUB_PATH

    - name: Compilar Solucao (.XEX)
      run: |
        # Entra na pasta xbox e compila ignorando os erros de compatibilidade de código antigo
        msbuild xbox/*.sln /p:Configuration=Release /p:Platform="Xbox 360" /p:WarningLevel=0 /p:TreatWarningsAsErrors=false

    - name: Guardar Meu Emulador Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Meu_PPSSPP_BombaPatch
        path: |
          **/*.xex
          **/*.xsh
