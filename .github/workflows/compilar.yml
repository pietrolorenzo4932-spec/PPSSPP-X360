name: Compilar PPSSPP Xbox 360

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Instalar Dependencias do Xbox 360
      run: |
        invoke-webrequest -Uri "https://github.com" -OutFile "xdk.zip"
        expand-archive -Path "xdk.zip" -DestinationPath "C:\XDK"
        echo "XDK=C:\XDK" >> $GITHUB_ENV

    - name: Compilar Solucao (.XEX)
      run: |
        msbuild *.sln /p:Configuration=Release /p:Platform="Xbox 360" /p:WarningLevel=0
      continue-on-error: true

    - name: Guardar Emulador Pronto
      uses: actions/upload-artifact@v4
      with:
        name: PPSSPP_Xbox360_Pronto
        path: |
          **/*.xex
          **/*.xsh

