name: Compilar Meu PPSSPP Atualizado - Xbox 360

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_xbox360:
    runs-on: windows-latest

    steps:
    - name: 1. Puxando Código Novo
      uses: actions/checkout@v4

    - name: 2. Ativando MSBuild da Nuvem
      uses: microsoft/setup-msbuild@v2

    - name: 3. Configurando Compilação do Xbox
      run: |
        echo "XBOX360=1" >> $GITHUB_ENV
        echo "PLATFORM_XBOX360=1" >> $GITHUB_ENV

    - name: 4. Compilando o Emulador para o Bomba Patch
      run: |
        msbuild PPSSPP.sln /p:Configuration=Release /p:Platform="Xbox 360" /p:WarningLevel=0
      continue-on-error: true

    - name: 5. Capturando o Executável .XEX e Shaders
      uses: actions/upload-artifact@v4
      with:
        name: PPSSPP_BombaPatch_Xbox360
        path: |
          Build/Release/default.xex
          Build/Release/*.xex
          **/*.xsh
