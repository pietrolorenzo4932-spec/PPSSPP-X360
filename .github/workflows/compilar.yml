name: Compilar PPSSPP Xbox 360

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configurar Compilador PowerPC
      run: |
        # Configura as variáveis de ambiente necessárias para compilação multiplataforma do Xbox
        echo "Xbox360_Compile=true" >> $GITHUB_ENV
        echo "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Microsoft\XAudio2" >> $GITHUB_PATH

    - name: Compilar Solucao (.XEX)
      run: |
        msbuild *.sln /p:Configuration=Release /p:Platform="Xbox 360" /p:WarningLevel=0
      continue-on-error: true

    - name: Guardar Emulador Pronto
      uses: actions/upload-artifact@v4
      with:
        name: PPSSPP_Xbox360_Pronto
        path: |
          **/*.xex
          **/*.xsh

